name: Idea or request
description: A new check, option, item type or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like, and what it would make better when playing.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: How another Archipelago game does it, sketches, links.
