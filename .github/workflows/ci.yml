# On every push and pull request: the APWorld against the Archipelago version it targets (Archipelago's own test
# suites and test generations), and the mod's C++ part built on Windows, packaged with the Lua mod as an artifact. The
# Windows build (about 25 minutes) runs only when the C++ part or this file changed since the branch's last good one
# (the changes job); tags, main and manual runs always build.
# A version tag (v0.14.0, matching the mod's VERSION) also makes a DRAFT release with the mod zip, palworld.apworld and
# their checksums; a person reads it and publishes it.
name: CI

on:
  push:
    # build/<name>: push a feature branch under this name to get its Windows build without a pull request (not for a
    # branch that already has one open: its pull request builds it)
    branches: [main, 'build/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the C++ part needs building: yes for tags, main and manual runs; otherwise only if cppmod/ or this file
  # changed since the newest commit of this branch whose Windows build passed. Measured from that build, not from the
  # previous push, so a run that was cancelled or skipped can't let a C++ change through unbuilt.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      cpp: ${{ steps.decide.outputs.cpp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          # a pull request's own head, not the merge commit with main the checkout holds
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          build() { echo "cpp=true" >> "$GITHUB_OUTPUT"; echo "Windows build: yes ($1)"; exit 0; }
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            workflow_dispatch:*) build "manual run" ;;
            push:refs/tags/*) build "a tag" ;;
            push:refs/heads/main) build "main" ;;
          esac
          api="repos/$GITHUB_REPOSITORY/actions"
          runs=$(gh api "$api/workflows/ci.yml/runs?branch=$BRANCH&status=completed&per_page=30" --jq '.workflow_runs[].id') \
            || build "could not list earlier runs"
          base=""
          for run in $runs; do
            ok=$(gh api "$api/runs/$run/jobs" \
                   --jq '[.jobs[] | select(.name == "C++ mod (Windows)" and .conclusion == "success")] | length') \
              || build "could not read run $run"
            if [ "$ok" -gt 0 ]; then base=$(gh api "$api/runs/$run" --jq .head_sha); break; fi
          done
          [ -n "$base" ] || build "no earlier Windows build of $BRANCH found"
          git cat-file -e "$base^{commit}" 2>/dev/null || build "the last built commit ${base:0:7} is gone (history rewritten?)"
          changed=$(git diff --name-only "$base" "$HEAD_SHA" -- cppmod .github/workflows/ci.yml) \
            || build "could not compare ${base:0:7}"
          [ -z "$changed" ] || build "changed since ${base:0:7}: $(echo $changed)"
          echo "cpp=false" >> "$GITHUB_OUTPUT"
          echo "Windows build: no (nothing in cppmod/ or ci.yml changed since ${base:0:7}, which built)"

  apworld:
    name: APWorld on Archipelago ${{ matrix.archipelago }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        archipelago: ["0.6.8"]  # the APWorld's minimum_ap_version (the current release)
    steps:
      - uses: actions/checkout@v7
        with:
          path: palworld-archipelago
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Archipelago ${{ matrix.archipelago }}
        run: |
          git clone --depth 1 --branch "${{ matrix.archipelago }}" https://github.com/ArchipelagoMW/Archipelago.git archipelago
          python -m venv archipelago/.venv
          archipelago/.venv/bin/pip install -q -r archipelago/requirements.txt -r archipelago/WebHostLib/requirements.txt pytest pytest-subtests
      - name: Mod data matches the APWorld, and the mod's Lua logic
        run: |
          cd palworld-archipelago
          python3 tools/gen_lua_data.py
          git diff --exit-code mod/PalworldArchipelago/Scripts/ap_data.lua || { echo "::error::ap_data.lua is stale: run tools/gen_lua_data.py"; exit 1; }
          sudo apt-get install -y -qq lua5.4 > /dev/null
          tools/lua_harness.sh
      - name: The C++ part's image helper
        run: |
          cd palworld-archipelago/cppmod/APConnector
          g++ -std=c++17 -O1 -pthread -Isrc -Ithird_party/stb test/image_test.cpp src/image_tools.cpp -o "$RUNNER_TEMP/image_test"
          "$RUNNER_TEMP/image_test"
      - name: The C++ part's Pal-gift logic (the half that needs no Unreal headers)
        run: |
          cd palworld-archipelago/cppmod/APConnector
          g++ -std=c++17 -O1 -Isrc test/pal_gift_test.cpp src/pal_gift_logic.cpp -o "$RUNNER_TEMP/pal_gift_test"
          "$RUNNER_TEMP/pal_gift_test"
      - name: Archipelago's test suites
        run: AP_DIR="$GITHUB_WORKSPACE/archipelago" palworld-archipelago/tools/ap_tests.sh
      - name: Test generations
        env:
          AP_DIR: ${{ github.workspace }}/archipelago
        run: |
          cd palworld-archipelago
          tools/test_generate.sh 3
          EXTRA_OPTIONS='tower_count: 8' tools/test_generate.sh 2
          EXTRA_OPTIONS=$'area_locks: false\n  progressive_spheres: false\n  level_checks: every_10' tools/test_generate.sh 2
      # The .apworld as players get it (tools/build_apworld.py, as Archipelago's "Build APWorlds" makes it).
      - name: Build palworld.apworld
        env:
          AP_DIR: ${{ github.workspace }}/archipelago
        run: |
          mkdir -p apworld-out
          archipelago/.venv/bin/python palworld-archipelago/tools/build_apworld.py apworld-out/palworld.apworld
      - uses: actions/upload-artifact@v6
        with:
          name: palworld-apworld-${{ github.sha }}
          path: apworld-out/palworld.apworld
      # The options page's YAMLs, built by its own JavaScript (in QuickJS), against the .apworld as players get it.
      - name: Options page
        env:
          AP_DIR: ${{ github.workspace }}/archipelago
        run: |
          archipelago/.venv/bin/pip install -q quickjs
          archipelago/.venv/bin/python palworld-archipelago/tools/test_options_page.py

  # The mod's C++ part (APConnector), built on Windows against the UE4SS the game runs: Okaetsu's Palworld build,
  # release 2281fa31. UE4SS's Unreal headers live in a private repository that only Epic-linked GitHub accounts can
  # read; UEPSEUDO_TOKEN is used only to clone it here and is never written to the build output.
  cppmod:
    name: C++ mod (Windows)
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      UE4SS_COMMIT: 2281fa311e417b1dfddedbcd49972d764fddb244   # Okaetsu/RE-UE4SS release 2281fa31
      APCLIENTPP_COMMIT: 6b28cc1781006deae0e28c61752d11a83819585a
      WSWRAP_COMMIT: aeba7ac428028723fb26ce92488f260660f786b1
      SOECLIENT_COMMIT: 9bba4e1ce9fc10500813e9570329daf1dffdf606  # its vendored asio, websocketpp and json
    steps:
      - uses: actions/checkout@v7
        with:
          path: palworld-archipelago
      - name: Fetch UE4SS source
        shell: bash
        env:
          UEPSEUDO_TOKEN: ${{ secrets.UEPSEUDO_TOKEN }}
        run: |
          if [ -z "$UEPSEUDO_TOKEN" ]; then echo "::error::UEPSEUDO_TOKEN secret is missing"; exit 1; fi
          # Submodules use SSH URLs; route them through HTTPS with the token (global config of this runner only).
          git config --global url."https://x-access-token:${UEPSEUDO_TOKEN}@github.com/".insteadOf "git@github.com:"
          dir=palworld-archipelago/cppmod/RE-UE4SS
          git init -q "$dir" && cd "$dir"
          git remote add origin https://github.com/Okaetsu/RE-UE4SS.git
          git fetch -q --depth 1 origin "$UE4SS_COMMIT" && git checkout -q FETCH_HEAD
          git submodule update -q --init --recursive --depth 1
          git config --global --unset url."https://x-access-token:${UEPSEUDO_TOKEN}@github.com/".insteadOf
      - name: Fetch apclientpp and its header-only dependencies
        shell: bash
        run: |
          deps=palworld-archipelago/cppmod/deps; mkdir -p "$deps"
          fetch() { git init -q "$deps/$1" && git -C "$deps/$1" remote add origin "https://github.com/$2.git" &&
                    git -C "$deps/$1" fetch -q --depth 1 origin "$3" && git -C "$deps/$1" checkout -q FETCH_HEAD; }
          fetch apclientpp black-sliver/apclientpp "$APCLIENTPP_COMMIT"
          fetch wswrap black-sliver/wswrap "$WSWRAP_COMMIT"
          fetch ap-soeclient black-sliver/ap-soeclient "$SOECLIENT_COMMIT"
      # vcpkg's binary cache, kept between runs: OpenSSL is built from source once per vcpkg version (about 7 minutes),
      # then restored from the cache in seconds.
      - name: vcpkg version
        id: vcpkg
        shell: bash
        run: |
          echo "rev=$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "VCPKG_BINARY_SOURCES=clear;files,$(cygpath -w "$GITHUB_WORKSPACE/vcpkg-cache"),readwrite" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-cache"
      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-openssl-zlib-static-md-${{ steps.vcpkg.outputs.rev }}
      - name: OpenSSL and zlib (static, dynamic CRT)
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:x64-windows-static-md zlib:x64-windows-static-md
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          # Git Bash's /usr/bin/link.exe (the Unix link tool) shadows MSVC's linker: Rust build scripts in UE4SS's
          # patternsleuth then fail to link. Put the MSVC tools first.
          export PATH="$(cygpath -u "$VCToolsInstallDir")bin/Hostx64/x64:$PATH"
          which link.exe cl.exe
          cmake -S palworld-archipelago/cppmod -B build -G Ninja -DCMAKE_BUILD_TYPE=Game__Shipping__Win64 \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DAP_DEPS="$GITHUB_WORKSPACE/palworld-archipelago/cppmod/deps" \
            2>&1 | tee build.log
          cmake --build build --target APConnector 2>&1 | tee -a build.log
      # Job logs need admin rights to read, but annotations are public: publish the build's errors as one.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          errs=$( (grep -E 'error|Error|FAILED|CMake Error' build.log || tail -60 build.log) | grep -v 'error_code\|Werror' | head -60)
          echo "::error title=C++ build failed::$(printf '%s' "$errs" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
      - name: Package
        shell: bash
        run: |
          out=package/ue4ss/Mods
          mkdir -p "$out/APConnector/dlls"
          cp "$(find build -name APConnector.dll | head -1)" "$out/APConnector/dlls/main.dll"
          curl -sSfL -o "$out/APConnector/cacert.pem" https://curl.se/ca/cacert.pem   # Mozilla's CA bundle (MPL 2.0)
          cp -r palworld-archipelago/mod/PalworldArchipelago "$out/"
          ls -R package
      - uses: actions/upload-artifact@v6
        with:
          name: PalworldArchipelago-mod-${{ github.sha }}
          path: package

  # A version tag: a draft release with both builds. Its notes are a starting point; publishing is a person's call.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apworld, cppmod]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the mod's version
        run: |
          ver=$(sed -n 's/^local VERSION = "\(.*\)"/\1/p' mod/PalworldArchipelago/Scripts/main.lua)
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but the mod says $ver"; exit 1; }
      - uses: actions/download-artifact@v7
        with:
          name: PalworldArchipelago-mod-${{ github.sha }}
          path: mod-package
      - uses: actions/download-artifact@v7
        with:
          name: palworld-apworld-${{ github.sha }}
          path: dist
      - name: Assemble
        run: |
          (cd mod-package && zip -qr "../dist/PalworldArchipelago-$GITHUB_REF_NAME.zip" ue4ss)
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cat > notes.md <<EOF
          Palworld Archipelago $GITHUB_REF_NAME (draft: edit these notes before publishing).

          - \`PalworldArchipelago-$GITHUB_REF_NAME.zip\`: the mod. Its \`ue4ss\` folder goes over \`Pal/Binaries/Win64/ue4ss\`.
          - \`palworld.apworld\`: for whoever generates the multiworld (Archipelago 0.6.8 or newer).
          - Setup: [setup guide](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/apworld/palworld/docs/setup_en.md).

          The code and art were written by Claude (Opus 5.5), an AI model by Anthropic, at JustEyeTee's direction.
          Unofficial fan project; not affiliated with Pocketpair or the Archipelago project.
          EOF
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "Palworld Archipelago $GITHUB_REF_NAME" --notes-file notes.md
